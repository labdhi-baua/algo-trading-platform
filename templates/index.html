<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Swing Trader - Paper Trading Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #e0e0e0;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: rgba(20, 20, 30, 0.8);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid rgba(100, 200, 255, 0.2);
        }

        h1 {
            color: #64c8ff;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .status {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .status-item {
            background: rgba(50, 50, 70, 0.8);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #64c8ff;
        }

        .status-label {
            color: #a0a0a0;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .status-value {
            color: #64c8ff;
            font-size: 24px;
            font-weight: bold;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 1200px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(30, 30, 45, 0.9);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
        }

        .card h2 {
            color: #64c8ff;
            margin-bottom: 15px;
            font-size: 18px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(100, 200, 255, 0.3);
        }

        .signal-item {
            background: rgba(50, 50, 70, 0.6);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }

        .signal-item.sell {
            border-left-color: #f44336;
        }

        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .signal-type {
            font-weight: bold;
            color: #4CAF50;
            font-size: 14px;
            text-transform: uppercase;
        }

        .signal-item.sell .signal-type {
            color: #f44336;
        }

        .confidence {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .signal-details {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            font-size: 12px;
            margin-top: 10px;
        }

        .detail {
            background: rgba(100, 200, 255, 0.1);
            padding: 8px;
            border-radius: 4px;
        }

        .detail-label {
            color: #a0a0a0;
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .detail-value {
            color: #fff;
            font-weight: bold;
        }

        .portfolio-stat {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(100, 200, 255, 0.1);
        }

        .portfolio-stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #a0a0a0;
        }

        .stat-value {
            color: #64c8ff;
            font-weight: bold;
        }

        .stat-value.positive {
            color: #4CAF50;
        }

        .stat-value.negative {
            color: #f44336;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: rgba(50, 50, 70, 0.8);
            color: #64c8ff;
            padding: 12px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            border-bottom: 2px solid rgba(100, 200, 255, 0.3);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(100, 200, 255, 0.1);
        }

        tr:hover {
            background: rgba(100, 200, 255, 0.05);
        }

        .btn {
            background: #64c8ff;
            color: #1e1e2e;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #4ab5e6;
            transform: translateY(-2px);
        }

        .btn.danger {
            background: #f44336;
            color: white;
        }

        .btn.danger:hover {
            background: #d32f2f;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #a0a0a0;
        }

        .spinner {
            border: 4px solid rgba(100, 200, 255, 0.2);
            border-top: 4px solid #64c8ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            border-left: 4px solid;
        }

        .alert.success {
            background: rgba(76, 175, 80, 0.2);
            border-left-color: #4CAF50;
            color: #4CAF50;
        }

        .alert.error {
            background: rgba(244, 67, 54, 0.2);
            border-left-color: #f44336;
            color: #f44336;
        }

        .alert.info {
            background: rgba(100, 200, 255, 0.2);
            border-left-color: #64c8ff;
            color: #64c8ff;
        }

        #chart {
            height: 400px;
            margin-top: 15px;
        }

        .refresh-btn {
            float: right;
            padding: 8px 15px;
            background: rgba(100, 200, 255, 0.2);
            border: 1px solid #64c8ff;
            color: #64c8ff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .refresh-btn:hover {
            background: rgba(100, 200, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🚀 Master Swing Trader</h1>
            <p>Paper Trading Dashboard - 4-Hour Swing Strategy</p>

            <div class="status">
                <div class="status-item">
                    <div class="status-label">Portfolio Value</div>
                    <div class="status-value" id="portfolioValue">$10,000.00</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Total P&L</div>
                    <div class="status-value" id="totalPnL">+$500.00</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Win Rate</div>
                    <div class="status-value" id="winRate">72.5%</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Active Signals</div>
                    <div class="status-value" id="activeSignals">3</div>
                </div>
            </div>
        </header>

        <!-- Alerts -->
        <div id="alertContainer"></div>

        <!-- Main Dashboard -->
        <div class="dashboard">
            <!-- Signals Card -->
            <div class="card">
                <h2>
                    Recent Trading Signals
                    <button class="refresh-btn" onclick="refreshSignals()">↻ Refresh</button>
                </h2>
                <div id="signalsContainer" class="loading">
                    <div class="spinner"></div>
                    <p>Loading signals...</p>
                </div>
            </div>

            <!-- Portfolio Card -->
            <div class="card">
                <h2>Portfolio Status</h2>
                <div id="portfolioContainer" class="loading">
                    <div class="spinner"></div>
                    <p>Loading portfolio...</p>
                </div>
            </div>
        </div>

        <!-- Performance Chart -->
        <div class="card">
            <h2>Performance Analytics</h2>
            <div class="dashboard">
                <div>
                    <canvas id="performanceChart"></canvas>
                </div>
                <div>
                    <canvas id="metricsChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Trade History -->
        <div class="card">
            <h2>
                Trade History
                <button class="refresh-btn" onclick="refreshTrades()">↻ Refresh</button>
            </h2>
            <div id="tradesContainer" class="loading">
                <div class="spinner"></div>
                <p>Loading trades...</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/app.js"></script>
    <script src="/static/js/api.js"></script>
</body>
</html>
